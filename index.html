/* Layout concept: graph-paper notebook. A centered column, ink-blue headings, a yellow highlighter used only for the grade chip and the active step. */
:root{
  --bg:#f2f5fb;--paper:#ffffff;--ink:#0e1a3a;--muted:#56648a;--line:#d3dcef;--grid:#e1e8f5;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1226;--paper:#121c38;--ink:#e8edff;--muted:#9aa9d2;--line:#283760;--grid:#15203f;
  --brand:#6f95ff;--brand-ink:#0a1230;--hi:#ffd23f;--hi-ink:#2b2100;--soft:#1a2a57;
  --ok:#52d28d;--ok-bg:#11382a;--bad:#ff8a93;--bad-bg:#431f29;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1226;--paper:#121c38;--ink:#e8edff;--muted:#9aa9d2;--line:#283760;--grid:#15203f;
  --brand:#6f95ff;--brand-ink:#0a1230;--hi:#ffd23f;--hi-ink:#2b2100;--soft:#1a2a57;
  --ok:#52d28d;--ok-bg:#11382a;--bad:#ff8a93;--bad-bg:#431f29;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
#app{max-width:1020px;margin-inline:auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.m{unicode-bidi:isolate;direction:rtl;font-family:var(--f-display);font-weight:600;white-space:nowrap}
.n{unicode-bidi:isolate;direction:ltr;display:inline-block;font-family:var(--f-display);font-weight:600}

/* top / hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:22px}
.grade{display:inline-block;background:var(--hi);color:var(--hi-ink);font-family:var(--f-display);font-weight:900;font-size:1.05rem;padding:2px 16px;border-radius:6px;transform:rotate(-1.5deg)}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);font-weight:900;margin-block:10px 4px}
.by{color:var(--muted);font-weight:500}
.tiles{width:min(220px,40vw);height:auto}
.tiles .t1{fill:var(--brand)}.tiles .t2{fill:var(--hi)}.tiles .t3{fill:var(--soft);stroke:var(--line)}
.tiles .l1{fill:var(--brand-ink)}.tiles .l2{fill:var(--hi-ink)}.tiles .l3,.tiles .l4{fill:var(--ink)}
.tiles text{font-family:var(--f-display);font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central}
.tiles .l4{font-size:13px;fill:var(--muted)}
@media(max-width:560px){.hero{grid-template-columns:1fr}.tiles{display:none}}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:22px}
.lockgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.lockgrid{grid-template-columns:minmax(0,1fr)}}
.card h2{font-size:1.25rem;margin-bottom:6px}
.sub{color:var(--muted);font-size:.95rem}
label.f{display:block;font-weight:700;margin-block:14px 6px}
.in{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1.05rem}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.pwrow{display:flex;gap:8px}.pwrow .in{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 22px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-family:var(--f-display);cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.block{width:100%;margin-top:16px}
.btn.ok{background:var(--ok);color:#fff}
.err{color:var(--bad);font-weight:700;margin-top:10px;min-height:1.5em}
.note{color:var(--muted);font-size:.92rem;margin-top:12px}

/* contact column */
.contacts{display:flex;flex-direction:column;gap:10px}
.contact{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.contact:hover{border-color:var(--brand);transform:translateY(-1px)}
.contact b{font-family:var(--f-display);display:block;line-height:1.35}
.contact small{color:var(--muted);display:block;line-height:1.4}
.ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.ico svg{width:26px;height:26px}
.ico.wa{background:#1f9d55}.ico.tg{background:#2a8bd0}.ico.ig{background:linear-gradient(135deg,#f0883e,#d6336c 55%,#7a3fc4)}.ico.cm{background:#0b6b4a}

/* main nav */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h2{font-size:1.2rem}
.tabs{display:flex;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:5px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini .btn{padding:6px 14px;min-height:38px;font-size:.95rem}

.reach{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:6px}
.reach .nm{font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.reach a{display:flex;flex-wrap:wrap;align-items:center;gap:10px;text-decoration:none;font-weight:700;padding:4px 0}
.reach a span.go{background:var(--soft);color:var(--brand);border-radius:999px;padding:0 12px;font-size:.92rem;font-weight:700}
.reach a:hover span.go{background:var(--brand);color:var(--brand-ink)}

/* explanation */
.secnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.sec{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:start;font-family:var(--f-display);font-weight:700;line-height:1.4;display:flex;gap:10px;align-items:baseline}
.sec i{font-style:normal;color:var(--muted);font-weight:900}
.sec[aria-current="true"]{border-color:var(--brand);background:var(--soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--brand)}
.rule{background:var(--soft);border-radius:12px;padding:16px 18px;margin-bottom:18px;border-inline-start:6px solid var(--brand)}
.rule h3{font-size:1.1rem;margin-bottom:4px}
.exlist{display:grid;gap:16px}
.ex{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:20px}
.ex-n{display:inline-block;background:var(--hi);color:var(--hi-ink);font-family:var(--f-display);font-weight:900;border-radius:6px;padding:0 12px;font-size:.95rem}
.ex-stmt{font-size:1.2rem;font-weight:700;margin-block:10px 8px}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:.95rem;line-height:1}
.sb{min-width:0;flex:1}
.line{margin-block:4px;overflow-x:auto;overflow-y:hidden}
.res{display:inline-block;background:var(--hi);color:var(--hi-ink);border-radius:8px;padding:2px 14px;font-weight:700;margin-block:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700;min-height:42px}
.chip:hover:not([disabled]){border-color:var(--brand)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hint{color:var(--muted);font-weight:500}
.done{color:var(--ok);font-weight:700}

.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
.q-stmt{font-size:1.25rem;font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:54px;width:100%}
.opt:hover{border-color:var(--brand)}
.opt .ol{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;background:var(--paper)}
.opt .ot{min-width:0;overflow-x:auto;font-size:1.1rem}

.opt[aria-checked="true"] .ol{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.score{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem,8vw,3.2rem);line-height:1.2}
.rvlist{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.rv{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.rv.ok{border-color:var(--ok);background:var(--ok-bg)}.rv.bad{border-color:var(--bad);background:var(--bad-bg)}
.rv .tg{font-family:var(--f-display);font-weight:900}
.rv div{overflow-x:auto}
.confirm{background:var(--soft);border-radius:12px;padding:16px;margin-top:16px}
.confirm b{font-family:var(--f-display);font-size:1.25rem}
.foot{margin-top:28px}
.foot h3{font-size:1rem;color:var(--muted);margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function pickDistinct(correctKey,cands,seen,k){var out=[];cands.forEach(function(c){if(out.length>=k)return;if(c.key===correctKey||seen[c.h])return;seen[c.h]=1;out.push({h:c.h,ok:false})});return out}
function qFac(f1,f2){
  var e=expand(f1,f2),p1=f1[0],q1=f1[1],p2=f2[0],q2=f2[1];
  var fs=function(x,y){return sortF(x,y).map(function(f){return lin(f[0],f[1])}).join('')};
  var cands=[[[p1,-q1],[p2,-q2]],[[p1,q1],[p2,-q2]],[[p1,-q1],[p2,q2]],[[p1,q2],[p2,q1]],[[p1,q1+1],[p2,q2-1]],[[p1,q1+2],[p2,q2-2]]].map(function(c){return {h:M(fs(c[0],c[1])),key:expand(c[0],c[1]).join(',')}});
  var correct=M(fs(f1,f2)),seen={};seen[correct]=1;
  return {stmt:'حلل: '+M(P2(e[0],e[1],e[2])),opts:[{h:correct,ok:true}].concat(pickDistinct(e.join(','),cands,seen,3))}}
function qWidth(r,s,L){
  var W=L===r?s:r,cands=[-W,L,r+s,W+2,W+L].map(function(q){return {h:M(lin(1,q)),key:'k'+q}});
  var correct=M(lin(1,W)),seen={};seen[correct]=1;
  return {stmt:'مستطيل مساحته ('+M(P2(1,r+s,r*s))+') وحدة مربعة، وطوله '+M(lin(1,L))+'. أوجد عرضه.',opts:[{h:correct,ok:true}].concat(pickDistinct('k'+W,cands,seen,3))}}
function qPerim(r,s,L){
  var W=L===r?s:r,k=L+W,cands=[poly([[2,'س'],[k,'']]),poly([[4,'س'],[k,'']]),poly([[2,'س'],[2*k,'']]),poly([[4,'س'],[L*W,'']]),poly([[4,'س'],[2*k+2,'']])].map(function(t){return {h:M(t),key:t}});
  var ct=poly([[4,'س'],[2*k,'']]),correct=M(ct),seen={};seen[correct]=1;
  return {stmt:'مستطيل مساحته ('+M(P2(1,r+s,r*s))+') وحدة مربعة، وطوله '+M(lin(1,L))+'. أوجد محيطه.',opts:[{h:correct,ok:true}].concat(pickDistinct(ct,cands,seen,3))}}
function qDims(r,s){
  var fmt=function(x,y){return M(lin(1,x))+' و '+M(lin(1,y))};
  var cands=[[-r,-s],[r-2,s+2],[r,-s],[r+s,r*s]].map(function(c){return {h:fmt(c[0],c[1]),key:c[0]+','+c[1]}});
  var correct=fmt(r,s),seen={};seen[correct]=1;

function qCub(g,r,s){
  var fmt=function(gg,x,y){return M((gg?gx(gg):'س')+'، '+lin(1,x)+'، '+lin(1,y))};
  var cands=[[0,r,s],[g,-r,-s],[g,r+s,r*s],[g,r,-s],[g+1,r,s]].map(function(c){return {h:fmt(c[0],c[1],c[2]),key:c.join(',')}});

  return {stmt:'شبه مكعب حجمه ('+M(P3(g,g*(r+s),g*r*s))+') وحدة مكعبة. أوجد أبعاده.',opts:[{h:correct,ok:true}].concat(pickDistinct([g,r,s].join(','),cands,seen,3))}}

    +'<div class="ctl"><a class="btn" href="'+LNK.q+'?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener noreferrer">أرسل نتيجتك للمعلمة</a><button class="btn ghost" data-act="qcopy">نسخ النتيجة</button><button class="btn ghost" data-act="qretry">إعادة الاختبار</button></div><p class="fb good" id="copyfb"></p>'
    +'<ul class="rvlist">'+rv+'</ul></section><div style="margin-top:18px">'+reach()+'</div>'}
function mainView(){
  return headerBar()+(S.tab==='learn'?learnView():quizView())+'<div class="foot"><h3>تابعنا</h3>'+contacts()+'</div>'}
function teacherView(){
  return '<div class="bar"><div class="brand"><span class="grade">الصف التاسع 9</span><h2>لوحة المعلمة</h2></div><div class="mini"><button class="btn ghost" data-act="back">رجوع</button></div></div>'
   +'<section class="card"><h2>تغيير كلمة السر</h2><p class="sub">كلمة السر هذه يدخل بها الطلاب إلى الشرح التفاعلي والاختبار. تُحفظ بصيغة مشفرة ولا يمكن عرضها بعد الحفظ.</p>'
   +'<form data-form="tpw" autocomplete="off"><label class="f" for="np1">كلمة السر الجديدة (٤ أحرف على الأقل)</label><input class="in" id="np1" type="password" autocomplete="new-password" required minlength="4">'
   +'<label class="f" for="np2">أعد كتابة كلمة السر</label><input class="in" id="np2" type="password" autocomplete="new-password" required minlength="4">'
   +'<div class="err" role="alert">'+esc(S.tMsg)+'</div><button class="btn block" type="submit"'+(S.tBusy?' disabled':'')+'>'+(S.tBusy?'جارٍ الحفظ...':'حفظ كلمة السر')+'</button></form>'
   +'<p class="note">بعد الحفظ تتحدث الصفحة لجميع الطلاب، ويحتاجون كلمة السر الجديدة عند الدخول.</p></section>'}
function draw(){app.innerHTML=S.screen==='lock'?lockView():S.screen==='teacher'?teacherView():mainView()}

/* ---------- save password by republishing this page ---------- */
function buildDoc(h){
  var css=document.getElementById('main-css').textContent,js=document.getElementById('main-js').textContent,fonts=document.getElementById('fonts').outerHTML;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
   +'<title>'+TITLE+'</title><meta name="claude:viewport-fit-sides" content="cover">'+fonts+'<style id="main-css">'+css+'</style>'
   +'<script type="application/json" id="cfg">'+JSON.stringify({h:h})+'<\/script><div id="app" dir="rtl" lang="ar"></div><script id="main-js">'+js+'<\/script></body></html>'}
async function savePw(pw){
  var art=await window.claude.use('artifact');if(!art)throw {code:'unavailable'};
  await art.publish(buildDoc(sha(SALT+pw)))}

/* ---------- events ---------- */
function redrawCard(si,ei){var el=document.getElementById('ex-'+si+'-'+ei);if(el)el.innerHTML=cardHTML(si,ei)}
app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,Q=S.q;
  if(a==='togglepw'){var i=document.getElementById('pw');i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?'إظهار':'إخفاء'}
  else if(a==='tab'){S.tab=t.dataset.t;draw()}
  else if(a==='sec'){S.sec=+t.dataset.i;draw()}
  else if(a==='exnext'){var st=getEx(+t.dataset.s,+t.dataset.e);st.k++;redrawCard(+t.dataset.s,+t.dataset.e)}
  else if(a==='exreset'){S.exs[t.dataset.s+'-'+t.dataset.e]=null;redrawCard(+t.dataset.s,+t.dataset.e)}
  else if(a==='pick'){var si=+t.dataset.s,ei=+t.dataset.e,idx=+t.dataset.i,st2=getEx(si,ei),pk=SECS[si].ex[ei].steps.filter(function(x){return x.pick})[0].pick,p=pairs(pk.P)[idx];
    if(st2.tried.indexOf(idx)<0)st2.tried.push(idx);st2.last=idx;if(p[0]+p[1]===pk.S)st2.solved=true;redrawCard(si,ei)}
  else if(a==='qstart'){if(Q.draft.trim().length>=3){Q.phase='confirm';draw()}}
  else if(a==='qedit'){Q.phase='intro';draw()}
  else if(a==='qconfirm'){Q.name=Q.draft.trim();Q.list=shuffle(bank()).map(function(q){return {stmt:q.stmt,opts:shuffle(q.opts)}});Q.i=0;Q.ans=[];Q.phase='run';draw();window.scrollTo(0,0)}
  else if(a==='qopt'){Q.ans[Q.i]=+t.dataset.i;draw()}
  else if(a==='qnext'){Q.i++;draw();window.scrollTo(0,0)}
  else if(a==='qprev'){Q.i--;draw();window.scrollTo(0,0)}
  else if(a==='qfinish'){Q.phase='done';draw();window.scrollTo(0,0)}
  else if(a==='qretry'){Q.phase='confirm';draw();window.scrollTo(0,0)}
  else if(a==='qcopy'){var tx='الاسم: '+Q.name+'\nالنتيجة: '+ar(Q.list.reduce(function(s,q,i){return s+(q.opts[Q.ans[i]]&&q.opts[Q.ans[i]].ok?1:0)},0))+' من '+ar(Q.list.length);
    var fb=document.getElementById('copyfb');
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){fb.textContent='تم نسخ النتيجة ✓'},function(){fb.textContent='تعذر النسخ تلقائياً. اكتب نتيجتك وأرسلها لمعلمتك.'})}
  else if(a==='logout'){S.unlocked=false;S.screen='lock';S.q={phase:'intro',name:'',draft:'',list:[],i:0,ans:[]};draw()}
  else if(a==='teacher'){S.tMsg='';S.screen='teacher';draw()}
  else if(a==='back'){S.screen=S.unlocked?'main':'lock';draw()}
});
app.addEventListener('input',function(ev){
  if(ev.target.id==='stuName'){S.q.draft=ev.target.value;var b=document.getElementById('qgo');if(b)b.disabled=S.q.draft.trim().length<3}});
app.addEventListener('submit',async function(ev){
  ev.preventDefault();var f=ev.target.dataset.form;
  if(f==='pw'){var v=document.getElementById('pw').value;
    if(HASH&&sha(SALT+v)===HASH){S.unlocked=true;S.screen='main';S.err=''}else S.err='كلمة السر غير صحيحة، حاول مرة أخرى.';
    draw();var i=document.getElementById('pw');if(i&&S.err)i.focus()}
  else if(f==='tpw'){var a=document.getElementById('np1').value,b=document.getElementById('np2').value;
    if(a.length<4){S.tMsg='كلمة السر قصيرة. اكتب ٤ أحرف على الأقل.';draw();return}
    if(a!==b){S.tMsg='الكلمتان غير متطابقتين.';draw();return}
    S.tBusy=true;S.tMsg='';draw();
    try{await savePw(a);S.tBusy=false;S.tMsg='تم الحفظ.';draw()}
    catch(e){S.tBusy=false;var c=e&&e.code;S.tMsg=c==='conflict'?'تم تحديث الصفحة من مكان آخر. أعد المحاولة بعد التحديث.':(c==='not_writer'||c==='not_granted')?'هذا الحساب لا يملك صلاحية تعديل الصفحة.':'تعذر الحفظ الآن. حاول مرة أخرى بعد قليل.';draw()}}
});

draw();
(async function(){try{var cl=window.claude;if(!cl||!cl.use)return;var u=await cl.use('user');
  if(u&&(await u.canEdit())){S.canEdit=true;if(S.screen==='lock'&&!document.getElementById('pw').value)draw()}}catch(e){}})();
if(window.__TEST)window.__T={SECS:SECS,bank:bank,sha:sha,pairs:pairs,ar:ar};
})();
</script>
